name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1-5"   # nightly regression, weekdays 03:00 UTC
  workflow_dispatch:
    inputs:
      groups:
        description: "JUnit tags to run (e.g. smoke, regression). Empty = all"
        required: false
        default: ""
      cucumber_tags:
        description: "Cucumber tag expression (e.g. @smoke). Empty = all"
        required: false
        default: ""

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        env:
          AUTH_USERNAME: ${{ secrets.AUTH_USERNAME || 'admin' }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD || 'password123' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.groups }}" ]; then ARGS="$ARGS -Dgroups=${{ github.event.inputs.groups }} -Dexcluded.groups=none"; fi
          if [ -n "${{ github.event.inputs.cucumber_tags }}" ]; then ARGS="$ARGS -Dcucumber.filter.tags=${{ github.event.inputs.cucumber_tags }}"; fi
          mvn -B test $ARGS

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html

      - name: Publish JUnit summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API test results
          path: target/surefire-reports/*.xml
          reporter: java-junit
